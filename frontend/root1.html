      function populateDropdowns() {
        const sourceDropdown = document.getElementById('source');
        const destinationDropdown = document.getElementById('destination');

        for (const station in metroStations) {
          const option = document.createElement('option');
          option.value = station;
          option.textContent = station;
          sourceDropdown.appendChild(option.cloneNode(true));
          destinationDropdown.appendChild(option);
        }
      }

      function calculate() {
  const source = document.getElementById('source').value;
  const destination = document.getElementById('destination').value;

  if (!source || !destination) {
    alert('Please select both source and destination stations.');
    return;
  }

  const distances = {};
  const visited = {};
  const path = {};
  const INF = Number.MAX_SAFE_INTEGER;

  Object.keys(metroStations).forEach(station => {
    distances[station] = INF;
  });
  distances[source] = 0;

  while (true) {
    let closestStation = null;

    for (const station in distances) {
      if (!visited[station] && (closestStation === null || distances[station] < distances[closestStation])) {
        closestStation = station;
      }
    }

    if (closestStation === null || distances[closestStation] === INF) break;

    visited[closestStation] = true;

    for (const neighbor in metroStations[closestStation]) {
      const newDistance = distances[closestStation] + metroStations[closestStation][neighbor];
      if (newDistance < distances[neighbor]) {
        distances[neighbor] = newDistance;
        path[neighbor] = closestStation;
      }
    }
  }

  const route = [];
  let current = destination;
  while (current) {
    route.unshift(current);
    current = path[current];
  }
  const distance = distances[destination];

  // Calculate fare based on distance
  const fare = calculateFare(distance);

  // Display the results
  document.getElementById('route').textContent = route.join('\n----->');
  document.getElementById('distance').textContent = 'Distance: ' + distance + 'km';
  document.getElementById('fare').textContent = 'Fare: ₹' + fare ; 
}

// Fare calculation function
function calculateFare(distance) {
  if (distance <= 2) return 10;
  if (distance <= 4) return 15;
  if (distance <= 6) return 20;
  if (distance <= 8) return 25;
  if (distance <= 10) return 30;
  if (distance <= 15) return 40;
  if (distance <= 20) return 50;
  if (distance <= 25) return 60;
  if (distance <= 30) return 70;
  return 80; // Maximum fare for distances > 20 km
}

    container.appendChild(img);
  }
